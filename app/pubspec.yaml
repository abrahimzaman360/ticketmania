name: app
description: "Ticket Mania - EU Public Transport Ticket Booking Service"
publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.10.1

dependencies:
  flutter:
    sdk: flutter

  # The following adds the Cupertino Icons font to your application.
  # Use with the CupertinoIcons class for iOS style icons.
  cupertino_icons: ^1.0.8
  supabase_flutter: ^2.0.0
  
  # QR Code generation and scanning
  qr_flutter: ^4.1.0
  
  # Maps - OpenStreetMap (works on all platforms)
  # For iOS/macOS: Can be extended with native MapKit via platform channels
  flutter_map: ^8.2.2
  latlong2: ^0.9.1
  
  # Location services
  geolocator: ^14.0.2
  
  # BLE (Bluetooth Low Energy)
  flutter_blue_plus: ^2.0.2
  
  # State management
  provider: ^6.1.1
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^3.0.3
  
  # Offline-first database
  drift: ^2.29.0
  sqlite3_flutter_libs: ^0.5.18
  path_provider: ^2.1.2
  path: ^1.9.0
  
  # Network connectivity
  connectivity_plus: ^7.0.0 
  
  # HTTP client
  http: ^1.2.0
  
  # UUID generation
  uuid: ^4.3.3
  
  # Date/time utilities
  intl: ^0.20.2
  
  # Localization
  flutter_localizations:
    sdk: flutter
  
  # Permission handling
  permission_handler: ^12.0.1 
  
  # Home widget support
  home_widget: ^0.8.1
  
  # Shared preferences for storing settings
  shared_preferences: ^2.5.3
  
  # Local notifications
  flutter_local_notifications: ^19.5.0
  
  # URL launcher for opening links
  url_launcher: ^6.3.1
  
  # Biometric Authentication
  local_auth: ^3.0.0
  
  # Secure Storage
  flutter_secure_storage: ^9.2.4
  
  # Splash screen
  flutter_native_splash: ^2.4.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  
  # App icon generator
  flutter_launcher_icons: ^0.14.4
  
  # Code generation for Riverpod and Drift
  build_runner: ^2.10.4
  drift_dev: ^2.29.0
  riverpod_generator: ^3.0.3

flutter:
  generate: true

  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/AppLogo.png

# Splash screen configuration
flutter_native_splash:
  color: "#00BF63"
  image: "assets/AppLogo.png"
  android: true
  ios: true
  web: true
  android_12:
    image: "assets/AppLogo.png"
    color: "#00BF63"

# App icon configuration
flutter_launcher_icons:
  android: true
  ios: true
  web:
    generate: true
    image_path: "assets/AppLogo.png"
    background_color: "#FFFFFF"
    theme_color: "#FFFFFF"
  image_path: "assets/AppLogo.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/AppLogo.png"
